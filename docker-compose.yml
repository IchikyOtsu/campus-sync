services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_sync
      POSTGRES_USER: campus_sync
      POSTGRES_PASSWORD: campus_sync
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    command: sh -c "python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://campus_sync:campus_sync@db:5432/campus_sync
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-5174}:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  postgres_data:
