[project]
name = "campus-sync-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6", "httpx>=0.27", "icalendar>=6.0", "python-dateutil>=2.9",
  "PyJWT[crypto]>=2.9", "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
